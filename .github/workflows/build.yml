name: Build Ryuna Ria

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PSP executable
        run: make clean all

      - name: Install ISO packaging toolchain
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 9.0 --install-dir /opt/dotnet
          git clone --depth 1 https://github.com/quickstraw/UMDGenCLI.git /tmp/umdgencli
          /opt/dotnet/dotnet publish /tmp/umdgencli/UMDGenCLI.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o /opt/umdgen

      - name: Assemble PSP UMD image
        run: |
          rm -rf iso-root dist /tmp/pbp-unpacked
          mkdir -p iso-root/PSP_GAME/SYSDIR dist /tmp/pbp-unpacked

          # Extract the PBP sections; unpack-pbp writes the sections to its
          # current directory rather than accepting an output-directory flag.
          cd /tmp/pbp-unpacked
          unpack-pbp "$GITHUB_WORKSPACE/EBOOT.PBP"
          cd "$GITHUB_WORKSPACE"

          # A homebrew PRX becomes the executable payload of the UMD-style
          # image. The ISO receives a game-category PARAM.SFO rather than the
          # Memory Stick homebrew category used by EBOOT.PBP.
          cp /tmp/pbp-unpacked/PARAM.SFO iso-root/PSP_GAME/PARAM.SFO
          cp RyunaRia.prx iso-root/PSP_GAME/SYSDIR/EBOOT.BIN
          mksfoex \
            -s CATEGORY=UG \
            -s DISC_ID=RUNA00001 \
            -s DISC_VERSION=1.00 \
            -s PSP_SYSTEM_VER=1.00 \
            -d BOOTABLE=1 \
            -d DISC_NUMBER=1 \
            -d DISC_TOTAL=1 \
            -d REGION=0x8000 \
            "Ryuna Ria" iso-root/PSP_GAME/PARAM.SFO

          /opt/dotnet/umdgen create iso-root dist/RyunaRia.iso --label RYUNARIA --padding umd
          /opt/dotnet/umdgen verify dist/RyunaRia.iso
          test -s dist/RyunaRia.iso

      - name: Upload only the game ISO
        uses: actions/upload-artifact@v4
        with:
          name: RyunaRia
          path: dist/RyunaRia.iso
          if-no-files-found: error
          retention-days: 14
