name: Build Ryuna Ria

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
      env:
        PSPDEV: /usr/local/pspdev
        PSPSDK: /usr/local/pspdev/psp/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PSP toolchain
        run: |
          test -f "$PSPSDK/lib/build.mak"
          command -v make
          command -v unpack-pbp
          command -v mksfoex

      - name: Install ISO packaging prerequisites
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y git curl ca-certificates
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm git curl ca-certificates
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache git curl ca-certificates icu-libs icu-data-full
          else
            echo "No supported package manager found in PSPDEV container" >&2
            exit 1
          fi
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 9.0 --install-dir /opt/dotnet
          git clone --depth 1 https://github.com/quickstraw/UMDGenCLI.git /tmp/umdgencli
          /opt/dotnet/dotnet publish /tmp/umdgencli/UMDGenCLI.csproj -c Release -r linux-musl-x64 --self-contained true -p:PublishSingleFile=true -o /opt/umdgen
          test -x /opt/umdgen/UMDGenCLI

      - name: Assemble and verify PSP ISO
        run: |
          rm -rf iso-root dist /tmp/pbp-unpacked
          mkdir -p iso-root/PSP_GAME/SYSDIR dist /tmp/pbp-unpacked

          cd /tmp/pbp-unpacked
          unpack-pbp "$GITHUB_WORKSPACE/EBOOT.PBP"
          cd "$GITHUB_WORKSPACE"

          test -s RyunaRia.prx
          mksfoex \
            -s CATEGORY=UG \
            -s DISC_ID=RUNA00001 \
            -s DISC_VERSION=1.00 \
            -s PSP_SYSTEM_VER=1.00 \
            -d BOOTABLE=1 \
            -d DISC_NUMBER=1 \
            -d DISC_TOTAL=1 \
            -d REGION=0x8000 \
            "Ryuna Ria" iso-root/PSP_GAME/PARAM.SFO
          cp RyunaRia.prx iso-root/PSP_GAME/SYSDIR/EBOOT.BIN

          /opt/umdgen/UMDGenCLI create iso-root dist/RyunaRia.iso --label RYUNARIA --padding umd
          /opt/umdgen/UMDGenCLI verify dist/RyunaRia.iso
          test -s dist/RyunaRia.iso

      - name: Upload only the game ISO
        uses: actions/upload-artifact@v4
        with:
          name: RyunaRia
          path: dist/RyunaRia.iso
          if-no-files-found: error
          retention-days: 14
